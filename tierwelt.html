<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#dff5ff">
<title>Kuh- & Nilpferdwelt – Für Daria</title>
<style>
:root{--pink:#d94f83;--ink:#45333d}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff8fc,#f9dce8 45%,#dff5ff);display:grid;place-items:center;padding:20px}.wrap{width:min(900px,100%);text-align:center;background:#ffffffb8;border:1px solid #ffffff;border-radius:30px;padding:clamp(22px,5vw,48px);box-shadow:0 18px 55px #7535551f;backdrop-filter:blur(14px)}h1{color:var(--pink);font-size:clamp(2rem,6vw,3.5rem);margin:8px 0}p{line-height:1.7}.stage{position:relative;min-height:clamp(250px,45vw,380px);display:flex;align-items:center;justify-content:center;gap:clamp(8px,5vw,45px);overflow:hidden;border-radius:25px;background:linear-gradient(180deg,#dff5ff,#e7f8e8 72%,#c7e8c4);padding:20px;margin:24px 0}.animal{font-size:clamp(5rem,16vw,9rem);cursor:pointer;user-select:none;filter:drop-shadow(0 8px 5px #3453);animation:bob 2.6s ease-in-out infinite;transition:transform .25s}.animal:nth-child(2){animation-delay:.4s}.animal:nth-child(3){animation-delay:.8s}.animal:hover{transform:scale(1.16) rotate(-7deg)}@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}button,.back{display:inline-block;margin:6px;padding:12px 18px;border:0;border-radius:999px;background:linear-gradient(135deg,#ed729d,#d94f83);color:white;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;box-shadow:0 6px 16px #d94f8328;transition:.2s}button:hover,.back:hover{transform:translateY(-2px)}.secondary{background:#fff;color:#a54470;border:1px solid #d94f8330;box-shadow:none}.message{min-height:2em;color:#934467;font-weight:800}.spark{position:fixed;pointer-events:none;font-size:2rem;animation:rise 1.8s ease-out forwards}@keyframes rise{to{opacity:0;transform:translateY(-150px) rotate(30deg) scale(1.5)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body><main class="wrap"><p>✨ Eine kleine Extra-Seite ✨</p><h1>🐄 Die verrückte Kuh- & Nilpferdwelt 🦛</h1><p>Tippe auf die tierischen Freunde – jeder Klick bringt eine kleine Überraschung. ❤️</p>
<div class="stage" id="stage"><span class="animal" tabindex="0" role="button" data-name="Kuh" aria-label="Kuh anklicken">🐄</span><span class="animal" tabindex="0" role="button" data-name="Nilpferd" aria-label="Nilpferd anklicken">🦛</span><span class="animal" tabindex="0" role="button" data-name="Herz" aria-label="Herz anklicken">💖</span></div>
<p id="message" class="message" aria-live="polite">Unsere kleine Tierwelt wartet auf dich!</p><button id="sparkle">✨ Glitzerregen</button><button class="secondary" id="surprise">🎁 Überraschung</button><p><a class="back" href="index_bearbeitet.html">← Zurück zum Kalender</a></p></main>
<script>
const messages={Kuh:['Muuuuh! Ein Lächeln für dich! 🐮','Die Kuh schickt dir eine Portion Glück! 🌼','Muh-nifestiere heute etwas Schönes!'],Nilpferd:['Platsch! Eine Umarmung aus dem Wasser! 🦛','Das Nilpferd tanzt nur für dich! 💃','Ein großer Freund für ein großes Herz!'],Herz:['Ganz viel Liebe für dich! ❤️','Herzchenregen! 💕','Du bist etwas ganz Besonderes! ✨']};
function burst(x,y,count=1){for(let i=0;i<count;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','💗','🌸','⭐','💕'][Math.floor(Math.random()*5)];s.style.left=(x+(Math.random()-.5)*100)+'px';s.style.top=(y+(Math.random()-.5)*35)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1900)}}
function act(el){const name=el.dataset.name,opts=messages[name]||messages.Herz;document.getElementById('message').textContent=opts[Math.floor(Math.random()*opts.length)];el.animate([{transform:'scale(1)'},{transform:'scale(1.25) rotate(-8deg)'},{transform:'scale(1)'}],{duration:500});const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,3)}
document.querySelectorAll('.animal').forEach(el=>{el.addEventListener('click',()=>act(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(el)}})});
document.getElementById('sparkle').addEventListener('click',()=>{burst(innerWidth/2,innerHeight*.65,18);document.getElementById('message').textContent='Ein ganzer Regen aus Glitzer und Liebe! ✨'});
document.getElementById('surprise').addEventListener('click',()=>{const a=['Muuuuh plus Platsch ergibt ganz viel Liebe! 🐄🦛','Zwei verrückte Freunde, ein riesengroßes Herz! 💗','Kuh und Nilpferd sagen: Du bist wunderbar! 🌈'];document.getElementById('message').textContent=a[Math.floor(Math.random()*a.length)];burst(innerWidth/2,innerHeight*.6,9)});
</script></body></html>
